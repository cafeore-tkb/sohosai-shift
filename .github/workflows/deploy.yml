# main に push されたら、テスト → ビルド → Cloudflare Workers（アプリ本体＋カレンダー購読。https://sohosai-shift.cafeore.workers.dev）に公開する。
# GitHub Pages（旧 URL。https://cafeore-tkb.github.io/sohosai-shift/）は新 URL へ転送するだけのページ（pages/。#room=… などはそのまま）
# 必要な Secrets：CLOUDFLARE_API_TOKEN（「Workers スクリプトの編集」だけの API トークン）、CLOUDFLARE_ACCOUNT_ID
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        working-directory: worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
