# カレンダー配信の Worker（worker/）を Cloudflare にデプロイする。worker/ を変えて main に push したとき・手動で
# 必要な Secrets：CLOUDFLARE_API_TOKEN（「Workers スクリプトの編集」だけの API トークン）、CLOUDFLARE_ACCOUNT_ID
name: Deploy calendar worker

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run worker
      # Secrets を登録するまではデプロイしない（テストだけ）
      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        working-directory: worker
        run: npx --yes wrangler@4 deploy
